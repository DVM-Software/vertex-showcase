<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vertex AI: expense intelligence in two minutes</title>
</head>
<body>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="shade" aria-hidden="true"></div>
<div id="labels" aria-hidden="true"></div>

<header class="top">
  <div class="brand"><i class="gem"></i><span id="brandA"></span><em></em><span class="b" id="brandB"></span></div>
  <div class="clock" id="clock">0:00 / 2:00</div>
</header>

<main id="copy" data-state="pre" aria-live="polite">
  <p class="kicker" id="kicker"></p>
  <h1 class="title" id="titleWrap"><span id="title"></span></h1>
  <p class="sub" id="sub"></p>
  <div class="meta" id="meta"></div>
</main>

<div id="scrim" aria-hidden="true"></div>
<div id="shots" aria-hidden="true"></div>
<div id="team" aria-hidden="true"></div>

<footer class="bar">
  <div class="segs" id="segs"></div>
  <div class="ctl">
    <button id="prev" aria-label="Previous scene"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <button id="play" aria-label="Pause"></button>
    <button id="next" aria-label="Next scene"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
</footer>
<p class="hint">Space plays or pauses. Arrow keys change scene. R restarts. H hides the controls. V records the film to a video file.</p>
<div id="toast" role="status"></div>
<div id="fade" aria-hidden="true"></div>
<div id="fail"><p>The 3D scene could not start because WebGL is not available in this browser.</p></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
